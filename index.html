<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国旅行 Level 地图</title>
  <meta name="description" content="一个可交互的中国省级旅行 Level 地图，支持分级涂色、自动计分和图片导出。">
  <meta property="og:title" content="中国旅行 Level 地图">
  <meta property="og:description" content="记录长居、停留、旅游、中转、路过和想去的中国省级地区。">
  <meta property="og:type" content="website">
  <style>
    :root {
      --paper: #d6d0cc;
      --ink: #121212;
      --muted: #68605d;
      --panel: #eeeae6;
      --tile: #fbfaf7;
      --lived: #ff747d;
      --stayed: #ffb978;
      --visited: #ffe77a;
      --stopped: #8ceda9;
      --passed: #81a8f7;
      --want: #cbb2f6;
      --never: #fbfaf7;
      --marked-soft: #fff0da;
      --hover: #ffe77a;
      --blue: #78a7ff;
      --green: #87edae;
      --shadow: 0 18px 55px rgba(29, 24, 20, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(0deg, rgba(255, 255, 255, 0.13) 1px, transparent 1px) 0 0 / 72px 72px,
        var(--paper);
    }

    button,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 28px 28px 32px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 500;
      line-height: 0.96;
    }

    .level {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
    }

    .level-number {
      font-variant-numeric: tabular-nums;
    }

    .summary {
      min-width: 238px;
      padding: 14px 16px;
      border: 3px solid var(--ink);
      background: var(--panel);
      box-shadow: 8px 8px 0 rgba(18, 18, 18, 0.12);
    }

    .summary-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-top: 5px;
    }

    .summary-count {
      font-size: 35px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .summary-percent {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 12px;
      overflow: hidden;
      margin-top: 12px;
      border: 2px solid var(--ink);
      background: var(--tile);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--passed), var(--stopped), var(--visited), var(--stayed), var(--lived));
      transition: width 180ms ease;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 344px;
      gap: 28px;
      align-items: stretch;
    }

    .map-section {
      min-width: 0;
      padding: 6px 0 0;
    }

    .map-shell {
      position: relative;
      width: 100%;
      min-height: 520px;
      overflow: auto;
      padding: 16px 6px 24px;
    }

    .map {
      display: block;
      width: 100%;
      min-width: 760px;
      height: auto;
      overflow: visible;
    }

    .province {
      cursor: pointer;
    }

    .province-shape {
      fill: var(--province-fill, var(--never));
      stroke: var(--ink);
      stroke-width: 3.2;
      vector-effect: non-scaling-stroke;
      transition: fill 160ms ease, transform 140ms ease, filter 140ms ease;
    }

    .province:hover .province-shape {
      filter: drop-shadow(5px 5px 0 rgba(18, 18, 18, 0.13));
    }

    .province:focus-visible .province-shape {
      stroke: #0f62fe;
      stroke-width: 5;
    }

    .province-label {
      fill: var(--ink);
      pointer-events: none;
      font-weight: 650;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.34);
      stroke-width: 2px;
      stroke-linejoin: round;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      align-self: start;
      height: calc(100vh - 76px);
      max-height: calc(100vh - 76px);
      overflow: hidden;
      border: 3px solid var(--ink);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-head {
      flex: 0 0 auto;
      padding: 16px;
      border-bottom: 3px solid var(--ink);
      background: #f8f5f1;
    }

    .field {
      margin-bottom: 12px;
    }

    .control-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .title-input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      outline: none;
      font-weight: 750;
    }

    .title-input:focus {
      border-color: #0f62fe;
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.18);
    }

    .palette {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .status-btn {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      min-width: 0;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 6px 9px;
      border: 2px solid var(--ink);
      background: var(--tile);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      font-weight: 760;
      transition: background 130ms ease, box-shadow 130ms ease;
    }

    .swatch {
      width: 22px;
      height: 18px;
      flex: 0 0 auto;
      border: 3px solid var(--ink);
      background: var(--status-color, var(--tile));
    }

    .status-btn .points {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-btn:hover {
      background: var(--hover);
    }

    .status-btn.active {
      box-shadow: inset 0 0 0 3px #0f62fe;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .filter,
    .tool-btn {
      min-height: 38px;
      border: 2px solid var(--ink);
      background: var(--tile);
      color: var(--ink);
      cursor: pointer;
      font-weight: 750;
      transition: background 130ms ease, transform 130ms ease;
    }

    .filter:hover,
    .tool-btn:hover {
      background: var(--hover);
    }

    .filter.active {
      background: var(--blue);
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .status-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .stat-pill {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 8px;
      border: 2px solid var(--ink);
      background: var(--tile);
      font-size: 13px;
      font-weight: 760;
    }

    .stat-pill::before {
      content: "";
      width: 14px;
      height: 12px;
      border: 2px solid var(--ink);
      background: var(--status-color, var(--tile));
    }

    .stat-pill span:last-child {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .message {
      min-height: 20px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .search {
      width: 100%;
      min-height: 40px;
      margin-top: 10px;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search:focus {
      border-color: #0f62fe;
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.18);
    }

    .province-list {
      display: grid;
      flex: 1 1 auto;
      gap: 8px;
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .province-btn {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 42px;
      gap: 10px;
      padding: 7px 10px;
      border: 2px solid var(--ink);
      background: var(--tile);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      font-weight: 760;
    }

    .province-btn .mini-swatch {
      width: 22px;
      height: 18px;
      border: 2px solid var(--ink);
      background: var(--status-color, var(--tile));
    }

    .province-btn .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .province-btn .state {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .province-btn.marked {
      background: var(--marked-soft);
    }

    .province-btn.status-never {
      background: var(--tile);
    }

    .province-btn:hover {
      background: var(--hover);
    }

    .province-btn:focus-visible,
    .status-btn:focus-visible,
    .filter:focus-visible,
    .tool-btn:focus-visible {
      outline: 3px solid #0f62fe;
      outline-offset: 2px;
    }

    .empty {
      display: none;
      padding: 22px 10px;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .side-panel {
        height: auto;
        max-height: none;
      }

      .province-list {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        flex: none;
        max-height: none;
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 18px 14px 24px;
      }

      .topbar {
        display: block;
      }

      .summary {
        width: 100%;
        margin-top: 14px;
      }

      .map-shell {
        min-height: 430px;
        padding-left: 0;
        padding-right: 0;
      }

      .map {
        min-width: 690px;
      }

      .filter-grid,
      .tools,
      .status-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1><span class="level"><span id="displayTitle">中国</span> Level <span id="levelNumber" class="level-number">0</span></span></h1>
      <section class="summary" aria-label="完成度">
        <div class="summary-label">当前等级分</div>
        <div class="summary-row">
          <div class="summary-count"><span id="scoreCount">60</span>/<span id="maxScore">170</span></div>
          <div id="markedText" class="summary-percent">20 个地区</div>
        </div>
        <div class="progress" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
      </section>
    </header>

    <main class="workspace">
      <section class="map-section" aria-label="中国省份互动地图">
        <div class="map-shell">
          <svg id="chinaMap" class="map" viewBox="0 0 1120 880" role="img" aria-labelledby="mapTitle mapDesc">
            <title id="mapTitle">中国省份互动地图</title>
            <desc id="mapDesc">点击省级地区可以应用当前选择的旅行等级。</desc>
            <g id="provinceLayer"></g>
          </svg>
        </div>
      </section>

      <aside class="side-panel" aria-label="省份列表">
        <div class="panel-head">
          <div class="field">
            <label class="control-label" for="titleInput">地图标题</label>
            <input id="titleInput" class="title-input" type="text" value="中国" maxlength="24" aria-label="地图标题">
          </div>

          <div id="statusPalette" class="palette" aria-label="涂色等级"></div>

          <div class="filter-grid" role="group" aria-label="筛选">
            <button class="filter active" type="button" data-filter="all">全部</button>
            <button class="filter" type="button" data-filter="marked">已标记</button>
            <button class="filter" type="button" data-filter="unmarked">未标记</button>
          </div>

          <div class="tools">
            <button id="resetBtn" class="tool-btn" type="button">恢复清单</button>
            <button id="clearBtn" class="tool-btn" type="button">全部清空</button>
            <button id="exportBtn" class="tool-btn export-btn" type="button">导出图片</button>
          </div>

          <input id="searchInput" class="search" type="search" placeholder="搜索省份" aria-label="搜索省份">
          <div id="statusStats" class="status-stats" aria-label="等级统计"></div>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </div>
        <div id="provinceList" class="province-list"></div>
        <div id="emptyState" class="empty">没有匹配项</div>
      </aside>
    </main>
  </div>

  <script>
    const provinces = [
      { id: "xinjiang", name: "新疆", x: 45, y: 115, w: 235, h: 210, size: 33 },
      { id: "neimenggu", name: "内蒙古", x: 292, y: 66, w: 535, h: 92, size: 34 },
      { id: "heilongjiang", name: "黑龙江", x: 868, y: 42, w: 182, h: 112, size: 30 },
      { id: "jilin", name: "吉林", x: 912, y: 164, w: 122, h: 80, size: 26 },
      { id: "liaoning", name: "辽宁", x: 872, y: 256, w: 126, h: 80, size: 26 },
      { id: "beijing", name: "北京", x: 788, y: 210, w: 54, h: 42, size: 18 },
      { id: "tianjin", name: "天津", x: 842, y: 235, w: 54, h: 42, size: 18 },
      { id: "hebei", name: "河北", x: 748, y: 282, w: 126, h: 108, size: 28 },
      { id: "shanxi", name: "山西", x: 646, y: 292, w: 100, h: 118, size: 27 },
      { id: "shandong", name: "山东", x: 874, y: 376, w: 138, h: 88, size: 28 },
      { id: "ningxia", name: "宁夏", x: 520, y: 253, w: 62, h: 70, size: 18 },
      { id: "gansu", name: "甘肃", x: 388, y: 188, w: 132, h: 122, size: 28 },
      { id: "qinghai", name: "青海", x: 252, y: 332, w: 218, h: 130, size: 31 },
      { id: "xizang", name: "西藏", x: 78, y: 472, w: 282, h: 170, size: 32 },
      { id: "shaanxi", name: "陕西", x: 548, y: 344, w: 96, h: 132, size: 26 },
      { id: "henan", name: "河南", x: 646, y: 422, w: 130, h: 92, size: 29 },
      { id: "jiangsu", name: "江苏", x: 912, y: 470, w: 96, h: 114, size: 25 },
      { id: "anhui", name: "安徽", x: 804, y: 486, w: 106, h: 118, size: 26 },
      { id: "shanghai", name: "上海", x: 1008, y: 552, w: 52, h: 38, size: 16 },
      { id: "sichuan", name: "四川", x: 392, y: 444, w: 162, h: 134, size: 30 },
      { id: "chongqing", name: "重庆", x: 556, y: 482, w: 82, h: 70, size: 20 },
      { id: "hubei", name: "湖北", x: 650, y: 530, w: 134, h: 92, size: 29 },
      { id: "zhejiang", name: "浙江", x: 888, y: 606, w: 104, h: 82, size: 25 },
      { id: "yunnan", name: "云南", x: 330, y: 596, w: 174, h: 134, size: 30 },
      { id: "guizhou", name: "贵州", x: 506, y: 596, w: 122, h: 98, size: 25 },
      { id: "hunan", name: "湖南", x: 628, y: 632, w: 130, h: 104, size: 29 },
      { id: "jiangxi", name: "江西", x: 760, y: 628, w: 116, h: 108, size: 27 },
      { id: "fujian", name: "福建", x: 872, y: 702, w: 108, h: 80, size: 25 },
      { id: "taiwan", name: "台湾", x: 1018, y: 710, w: 62, h: 122, size: 22 },
      { id: "guangxi", name: "广西", x: 510, y: 718, w: 126, h: 88, size: 27 },
      { id: "guangdong", name: "广东", x: 640, y: 746, w: 168, h: 72, size: 29 },
      { id: "aomen", name: "澳门", x: 718, y: 825, w: 45, h: 32, size: 15 },
      { id: "xianggang", name: "香港", x: 766, y: 825, w: 45, h: 32, size: 15 },
      { id: "hainan", name: "海南", x: 826, y: 826, w: 86, h: 38, size: 20 }
    ];

    const statuses = [
      { id: "lived", label: "长居", points: 5, color: "#ff747d" },
      { id: "stayed", label: "停留", points: 4, color: "#ffb978" },
      { id: "visited", label: "旅游过", points: 3, color: "#ffe77a" },
      { id: "stopped", label: "中转", points: 2, color: "#8ceda9" },
      { id: "passed", label: "路过", points: 1, color: "#81a8f7" },
      { id: "want", label: "想去", points: 0, color: "#cbb2f6" },
      { id: "never", label: "未去过", points: 0, color: "#fbfaf7" }
    ];

    const statusById = Object.fromEntries(statuses.map((status) => [status.id, status]));

    const defaultTitle = "中国";
    const storageKey = "china-travel-level:v4";
    const initialStatuses = Object.fromEntries(
      provinces.map((province) => [province.id, "never"])
    );
    const initialState = loadState();

    let activeFilter = "all";
    let selectedStatus = "visited";
    let mapTitle = initialState.title;
    let provinceStatuses = initialState.statuses;

    const provinceLayer = document.getElementById("provinceLayer");
    const provinceList = document.getElementById("provinceList");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const titleInput = document.getElementById("titleInput");
    const statusPalette = document.getElementById("statusPalette");
    const statusStats = document.getElementById("statusStats");
    const message = document.getElementById("message");

    function normalizeTitle(value) {
      const title = String(value || "").trim().slice(0, 24);
      return title || defaultTitle;
    }

    function normalizeStatuses(rawStatuses = {}) {
      return Object.fromEntries(
        provinces.map((province) => [
          province.id,
          statusById[rawStatuses[province.id]] ? rawStatuses[province.id] : initialStatuses[province.id]
        ])
      );
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && typeof saved === "object" && !Array.isArray(saved) && saved.statuses) {
          return {
            title: normalizeTitle(saved.title),
            statuses: normalizeStatuses(saved.statuses)
          };
        }
      } catch (error) {
        localStorage.removeItem(storageKey);
      }

      return {
        title: defaultTitle,
        statuses: { ...initialStatuses }
      };
    }

    function getStatePayload() {
      return {
        title: mapTitle,
        statuses: provinceStatuses
      };
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(getStatePayload()));
      } catch (error) {
        showMessage("浏览器未允许保存本地数据");
      }
    }

    function getStatus(provinceId) {
      return statusById[provinceStatuses[provinceId]] || statusById.never;
    }

    function setProvinceStatus(id, statusId = selectedStatus) {
      provinceStatuses[id] = statusById[statusId] ? statusId : "never";
      saveState();
      render();
    }

    function renderPalette() {
      statusPalette.innerHTML = "";
      statuses.forEach((status) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `status-btn${status.id === selectedStatus ? " active" : ""}`;
        button.style.setProperty("--status-color", status.color);
        button.setAttribute("aria-pressed", status.id === selectedStatus ? "true" : "false");
        button.innerHTML = `
          <span class="swatch" aria-hidden="true"></span>
          <span>${status.label}</span>
          <span class="points">${status.points} 分</span>
        `;
        button.addEventListener("click", () => {
          selectedStatus = status.id;
          renderPalette();
        });
        statusPalette.appendChild(button);
      });
    }

    function renderTitle() {
      document.getElementById("displayTitle").textContent = mapTitle;
      if (document.activeElement !== titleInput) {
        titleInput.value = mapTitle;
      }
    }

    function renderMap() {
      provinceLayer.innerHTML = "";

      provinces.forEach((province) => {
        const status = getStatus(province.id);
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", `province status-${status.id}`);
        group.setAttribute("data-id", province.id);
        group.setAttribute("data-status", status.id);
        group.setAttribute("role", "button");
        group.setAttribute("tabindex", "0");
        group.setAttribute("aria-label", `${province.name}，${status.label}，${status.points} 分`);
        group.style.setProperty("--province-fill", status.color);

        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = `${province.name}：${status.label}（${status.points} 分）`;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "province-shape");
        rect.setAttribute("x", province.x);
        rect.setAttribute("y", province.y);
        rect.setAttribute("width", province.w);
        rect.setAttribute("height", province.h);
        rect.setAttribute("rx", "3");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "province-label");
        text.setAttribute("x", province.x + province.w / 2);
        text.setAttribute("y", province.y + province.h / 2);
        text.setAttribute("font-size", province.size);
        text.textContent = province.name;

        group.addEventListener("click", () => setProvinceStatus(province.id));
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setProvinceStatus(province.id);
          }
        });

        group.append(title, rect, text);
        provinceLayer.appendChild(group);
      });
    }

    function renderList() {
      const keyword = searchInput.value.trim();
      const visibleProvinces = provinces.filter((province) => {
        const status = getStatus(province.id);
        const isMarked = status.id !== "never";
        const matchesFilter =
          activeFilter === "all" ||
          (activeFilter === "marked" && isMarked) ||
          (activeFilter === "unmarked" && !isMarked);
        const matchesSearch = !keyword || province.name.includes(keyword);
        return matchesFilter && matchesSearch;
      });

      provinceList.innerHTML = "";
      visibleProvinces.forEach((province) => {
        const status = getStatus(province.id);
        const isMarked = status.id !== "never";
        const button = document.createElement("button");
        button.type = "button";
        button.className = `province-btn status-${status.id}${isMarked ? " marked" : ""}`;
        button.style.setProperty("--status-color", status.color);
        button.setAttribute("aria-label", `${province.name}，当前${status.label}，点击设为${statusById[selectedStatus].label}`);
        button.innerHTML = `
          <span class="mini-swatch" aria-hidden="true"></span>
          <span class="name">${province.name}</span>
          <span class="state">${status.label} · ${status.points}分</span>
        `;
        button.addEventListener("click", () => setProvinceStatus(province.id));
        provinceList.appendChild(button);
      });

      emptyState.style.display = visibleProvinces.length ? "none" : "block";
    }

    function getScoreSummary() {
      const score = provinces.reduce((sum, province) => sum + getStatus(province.id).points, 0);
      const maxScore = provinces.length * statusById.lived.points;
      const markedCount = provinces.filter((province) => getStatus(province.id).id !== "never").length;
      const percent = maxScore ? (score / maxScore) * 100 : 0;

      return { score, maxScore, markedCount, percent };
    }

    function renderStats() {
      const { score, maxScore, markedCount, percent } = getScoreSummary();

      document.getElementById("levelNumber").textContent = score;
      document.getElementById("scoreCount").textContent = score;
      document.getElementById("maxScore").textContent = maxScore;
      document.getElementById("markedText").textContent = `${markedCount} 个地区`;
      document.getElementById("progressBar").style.width = `${percent}%`;
      document.title = `${mapTitle} Level ${score} - 中国旅行 Level 地图`;
    }

    function renderStatusStats() {
      const counts = Object.fromEntries(statuses.map((status) => [status.id, 0]));
      provinces.forEach((province) => {
        counts[getStatus(province.id).id] += 1;
      });

      statusStats.innerHTML = statuses.map((status) => `
        <div class="stat-pill" style="--status-color: ${status.color}">
          <span>${status.label}</span>
          <span>${counts[status.id]}</span>
        </div>
      `).join("");
    }

    function escapeXml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;");
    }

    function showMessage(text) {
      message.textContent = text;
      window.clearTimeout(showMessage.timer);
      showMessage.timer = window.setTimeout(() => {
        message.textContent = "";
      }, 2800);
    }

    function getSafeFilename(value) {
      return normalizeTitle(value).replace(/[\\/:*?"<>|]+/g, "-");
    }

    function buildExportSvg() {
      const { score, maxScore, markedCount, percent } = getScoreSummary();
      const width = 1800;
      const height = 1420;
      const mapX = 52;
      const mapY = 260;
      const mapScale = 1.16;
      const legendX = 1392;
      const legendY = 308;
      const progressWidth = 470;

      const provinceMarkup = provinces.map((province) => {
        const status = getStatus(province.id);
        return `
          <g>
            <rect x="${province.x}" y="${province.y}" width="${province.w}" height="${province.h}" rx="3"
              fill="${status.color}" stroke="#121212" stroke-width="4" />
            <text x="${province.x + province.w / 2}" y="${province.y + province.h / 2}"
              text-anchor="middle" dominant-baseline="central" font-size="${province.size}"
              font-weight="700" fill="#121212">${escapeXml(province.name)}</text>
          </g>
        `;
      }).join("");

      const legendMarkup = statuses.map((status, index) => {
        const y = legendY + index * 74;
        return `
          <g>
            <rect x="${legendX}" y="${y}" width="340" height="54" fill="#fbfaf7" stroke="#121212" stroke-width="4" />
            <rect x="${legendX + 24}" y="${y + 15}" width="32" height="24" fill="${status.color}" stroke="#121212" stroke-width="4" />
            <text x="${legendX + 78}" y="${y + 28}" dominant-baseline="central" font-size="30" font-weight="750" fill="#121212">${escapeXml(status.label)}</text>
            <text x="${legendX + 316}" y="${y + 28}" text-anchor="end" dominant-baseline="central" font-size="24" font-weight="750" fill="#68605d">${status.points} 分</text>
          </g>
        `;
      }).join("");

      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#81a8f7" />
              <stop offset="25%" stop-color="#8ceda9" />
              <stop offset="50%" stop-color="#ffe77a" />
              <stop offset="75%" stop-color="#ffb978" />
              <stop offset="100%" stop-color="#ff747d" />
            </linearGradient>
            <pattern id="grid" width="78" height="78" patternUnits="userSpaceOnUse">
              <path d="M 78 0 L 0 0 0 78" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
            </pattern>
          </defs>
          <rect width="${width}" height="${height}" fill="#d6d0cc" />
          <rect width="${width}" height="${height}" fill="url(#grid)" />
          <text x="70" y="126" font-size="78" font-weight="650" fill="#121212">${escapeXml(mapTitle)} Level ${score}</text>
          <rect x="1190" y="62" width="540" height="136" fill="#eeeae6" stroke="#121212" stroke-width="5" />
          <text x="1225" y="105" font-size="24" font-weight="750" fill="#68605d">当前等级分</text>
          <text x="1225" y="158" font-size="52" font-weight="800" fill="#121212">${score}/${maxScore}</text>
          <text x="1696" y="156" text-anchor="end" font-size="25" font-weight="750" fill="#68605d">${markedCount} 个地区</text>
          <rect x="1225" y="176" width="${progressWidth}" height="18" fill="#fbfaf7" stroke="#121212" stroke-width="3" />
          <rect x="1225" y="176" width="${Math.round(progressWidth * percent / 100)}" height="18" fill="url(#progressGradient)" />
          <g transform="translate(${mapX} ${mapY}) scale(${mapScale})">${provinceMarkup}</g>
          <text x="${legendX}" y="268" font-size="34" font-weight="750" fill="#121212">图例</text>
          ${legendMarkup}
          <text x="70" y="1360" font-size="24" font-weight="650" fill="#68605d">使用中国旅行 Level 地图生成，可更新颜色、统计分数并导出图片。</text>
        </svg>
      `;
    }

    function exportImage() {
      const { score } = getScoreSummary();
      const svg = buildExportSvg();
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const image = new Image();

      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.width;
        canvas.height = image.height;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);

        const link = document.createElement("a");
        link.download = `${getSafeFilename(mapTitle)}-Level-${score}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      };

      image.onerror = () => {
        URL.revokeObjectURL(url);
        alert("导出失败，请刷新页面后再试。");
      };

      image.src = url;
    }

    function renderFilters() {
      document.querySelectorAll(".filter").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === activeFilter);
      });
    }

    function render() {
      renderTitle();
      renderStats();
      renderPalette();
      renderMap();
      renderList();
      renderStatusStats();
      renderFilters();
    }

    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener("input", renderList);

    titleInput.addEventListener("input", () => {
      mapTitle = normalizeTitle(titleInput.value);
      saveState();
      renderTitle();
      renderStats();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      provinceStatuses = { ...initialStatuses };
      saveState();
      render();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      provinceStatuses = Object.fromEntries(provinces.map((province) => [province.id, "never"]));
      saveState();
      render();
    });

    document.getElementById("exportBtn").addEventListener("click", exportImage);

    render();
  </script>
</body>
</html>
